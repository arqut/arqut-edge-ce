name: Build Arqut Edge CE Application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # keyless cosign signing and build provenance
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set release tag
        id: set_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Using pushed tag: ${{ github.ref_name }}"
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "Latest tag: $LATEST_TAG"
            echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Related Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.set_tag.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Track the toolchain declared in go.mod rather than a hardcoded
          # version, so the two cannot drift apart.
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.0.1"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Build UI
        working-directory: ./ui
        run: |
          npm install
          npm run build

      - name: Build Binary with GoReleaser
        run: |
          set -e
          go version
          curl -sfL https://goreleaser.com/static/run | bash -s -- release --skip=announce,publish,validate --clean

          mkdir -p releases
          cp dist/arqut-edge-ce_linux_arm_7/arqut-edge-ce releases/arqut-edge-ce_linux-armv7
          cp dist/arqut-edge-ce_linux_arm_6/arqut-edge-ce releases/arqut-edge-ce_linux-armv6
          cp dist/arqut-edge-ce_linux_arm64_v8.0/arqut-edge-ce releases/arqut-edge-ce_linux-aarch64
          cp dist/arqut-edge-ce_linux_amd64_v1/arqut-edge-ce releases/arqut-edge-ce_linux-amd64
          cp dist/arqut-edge-ce_linux_386_sse2/arqut-edge-ce releases/arqut-edge-ce_linux-i386

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          # Runs before the checksum, signature, and SBOM files are added to
          # releases/, so only the binaries are attested.
          subject-path: releases/*

      - name: Generate Checksums
        working-directory: ./releases
        run: |
          set -e
          sha256sum arqut-edge-ce_linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Checksums
        working-directory: ./releases
        run: |
          set -e
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          # Scans the built tree, so the SBOM covers both the Go modules and
          # the npm packages bundled into the embedded UI.
          path: .
          format: spdx-json
          output-file: releases/arqut-edge-ce.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag_name }}
          name: "Release ${{ steps.set_tag.outputs.tag_name }}"
          files: releases/*
          body: |
            Automated release for Arqut Edge CE.

            ## Verifying this release

            Every binary is accompanied by a SHA-256 checksum, a Sigstore
            signature over those checksums, an SPDX SBOM, and a GitHub build
            provenance attestation.

            **1. Check the download matches its checksum**

            ```bash
            sha256sum --check --ignore-missing SHA256SUMS
            ```

            **2. Verify the checksums were signed by this workflow**

            ```bash
            cosign verify-blob SHA256SUMS \
              --signature SHA256SUMS.sig \
              --certificate SHA256SUMS.pem \
              --certificate-identity-regexp '^https://github.com/arqut/arqut-edge-ce/\.github/workflows/build\.yaml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            **3. Verify build provenance**

            ```bash
            gh attestation verify arqut-edge-ce_linux-amd64 --repo arqut/arqut-edge-ce
            ```

            Signing is keyless: there is no private key to steal, and the
            certificate records which workflow, repository, and tag produced
            the artifact.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
