name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-signoff:
    name: Check Signed-off-by
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            # Merge commits are created by GitHub and carry no sign-off.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            message="$(git show -s --format='%B' "$sha")"

            # Matched with a bash builtin rather than `grep -q`: grep exits as soon
            # as it matches, and the resulting SIGPIPE turns into a false failure
            # under `set -o pipefail`. The quoted needle is matched literally.
            if [[ "${message,,}" == *"signed-off-by: ${author,,}"* ]]; then
              echo "ok    $(git rev-parse --short "$sha")  $subject"
            else
              echo "FAIL  $(git rev-parse --short "$sha")  $subject"
              echo "      expected trailer: Signed-off-by: $author"
              failed=1
            fi
          done < <(git rev-list "$base..$head")

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          One or more commits are missing a Signed-off-by trailer matching their author.

          Fix the most recent commit:
              git commit --amend -s --no-edit && git push --force-with-lease

          Fix the whole branch:
              git rebase --signoff ${{ github.event.pull_request.base.ref }} && git push --force-with-lease

          See CONTRIBUTING.md for details.
          EOF
            exit 1
          fi

          echo "All commits signed off."
